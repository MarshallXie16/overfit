<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OVERFIT Art Preview</title>
    <link rel="icon" href="data:," />
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; background: #0c0e11; color: #c9ced4; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
      header { padding: 10px 16px; background: #14171b; border-bottom: 1px solid #23272d; position: sticky; top: 0; z-index: 2; }
      header b { color: #2fd4c4; }
      header .ax { color: #ff2a4d; }
      main { padding: 12px 16px 40px; }
      h2 { font-size: 13px; color: #8f98a3; margin: 22px 0 8px; text-transform: uppercase; letter-spacing: 0.08em; border-bottom: 1px solid #1f2328; padding-bottom: 4px; }
      .grid { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
      figure { margin: 0; padding: 6px; background: #171a1e; border: 1px solid #22262c; border-radius: 6px; display: flex; flex-direction: column; align-items: center; }
      figure.light { background: #4d4c47; }
      figure canvas { display: block; background-image: linear-gradient(45deg, #1d2025 25%, transparent 25%), linear-gradient(-45deg, #1d2025 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #1d2025 75%), linear-gradient(-45deg, transparent 75%, #1d2025 75%); background-size: 16px 16px; background-position: 0 0, 0 8px, 8px -8px, -8px 0; }
      figure.light canvas { background: #55534d; }
      figcaption { margin-top: 4px; color: #7d8691; font-size: 10px; max-width: 220px; word-break: break-all; text-align: center; }
      .scene { display: block; image-rendering: auto; border: 1px solid #23272d; }
      .pix canvas { image-rendering: pixelated; }
    </style>
  </head>
  <body>
    <header id="hdr">OVERFIT art preview — building…</header>
    <main id="main"></main>
    <script type="module" src="/src/render/art/preview.ts"></script>
  </body>
</html>
