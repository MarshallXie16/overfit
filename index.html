<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OVERFIT — The swarm learns you</title>
  <meta name="description" content="A browser RTS about an AI apocalypse. Humanity's last resistance cell vs. AXIOM, a robot swarm that grows, spreads and learns from how you fight." />
  <meta name="theme-color" content="#07090c" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="OVERFIT — The swarm learns you" />
  <meta property="og:description" content="A free browser RTS: hold the line against an ever-growing robot swarm that retrains on how you fight. Hack its machines, make it overfit, then pull the plug." />
  <!-- Share-card URLs must be absolute. %VITE_PUBLIC_URL% is set in .env (default
       https://marshallxie16.itch.io/overfit); override per build with
       VITE_PUBLIC_URL=https://your.host/path npm run build:single -->
  <meta property="og:url" content="%VITE_PUBLIC_URL%" />
  <meta property="og:image" content="%VITE_PUBLIC_URL%/og.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="OVERFIT — The swarm learns you" />
  <meta name="twitter:image" content="%VITE_PUBLIC_URL%/og.png" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%2307090c'/><path d='M16 4 L28 16 L16 28 L4 16 Z' fill='none' stroke='%23ff3355' stroke-width='3'/><circle cx='16' cy='16' r='4' fill='%2337e0c8'/></svg>" />
  <style>
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #07090c; color: #d6e2e0; font-family: system-ui, sans-serif; z-index: 100; letter-spacing: 3px; }
    #loading .t { font-size: 44px; font-weight: 800; letter-spacing: 14px; color: #fff; text-shadow: 0 0 30px rgba(255,51,85,.6); }
    #loading .msg { margin-top: 14px; font-size: 12px; color: #7d8f8c; }
    #loading .bar { width: 220px; height: 2px; background: rgba(55,224,200,.15); margin-top: 16px; overflow: hidden; position: relative; }
    #loading .bar i { position: absolute; left: 0; width: 40%; top: 0; bottom: 0; background: #37e0c8; transform: translateX(-100%); animation: ld 1s linear infinite; }
    @keyframes ld { to { transform: translateX(250%); } } /* transform, not left: runs on the compositor while the main thread builds the art atlas */
    #desktop-only { position: fixed; inset: 0; z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; background: rgba(7,9,12,.96); color: #d6e2e0; font-family: system-ui, sans-serif; }
    #desktop-only[hidden] { display: none; }
    #desktop-only b { font-size: 18px; letter-spacing: 3px; color: #fff; }
    #desktop-only p { max-width: 340px; margin: 0; font-size: 14px; line-height: 1.5; color: #9fb0ad; }
    #desktop-only button { margin-top: 6px; padding: 10px 18px; background: none; border: 1px solid #37e0c8; color: #37e0c8; font: inherit; letter-spacing: 2px; cursor: pointer; }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="ui"></div>
  <div id="loading"><div class="t">OVERFIT</div><div class="msg">Booting resistance network…</div><div class="bar"><i></i></div></div>
  <div id="desktop-only" hidden role="dialog" aria-labelledby="desktop-only-t">
    <b id="desktop-only-t">DESKTOP ONLY</b>
    <p>OVERFIT needs a mouse and keyboard. Touch controls are not supported, so please open this page on a computer.</p>
    <button type="button" onclick="this.parentNode.hidden=true">PLAY ANYWAY</button>
  </div>
  <script>
    // Touch-only device (coarse pointer, no fine pointer anywhere): show the desktop-only notice.
    if (window.matchMedia && matchMedia('(pointer: coarse)').matches && !matchMedia('(any-pointer: fine)').matches) document.getElementById('desktop-only').hidden = false;
  </script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
